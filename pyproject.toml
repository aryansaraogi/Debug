[project]
name = "devops-mcp"
version = "0.1.0"
description = "MCP servers that let an AI agent inspect a local dev environment: filesystem, git, docker, logs."
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=2.2,<3",
    "pathspec>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# The five MCP servers deliberately do NOT depend on the Anthropic SDK.
# Only the agent client that drives them does.
agent = ["anthropic>=1,<2", "python-dotenv>=1"]
# Only needed to re-render the README screenshots via scripts/render_docs.py.
docs = ["pillow>=10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["docker: needs a running Docker daemon (skipped automatically otherwise)"]
