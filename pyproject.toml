[project]
name = "devops-mcp"
version = "0.1.0"
description = "MCP servers that let an AI agent inspect a local dev environment: filesystem, git, docker, logs."
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=2.2,<3",
    "pathspec>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["docker: needs a running Docker daemon (skipped automatically otherwise)"]
